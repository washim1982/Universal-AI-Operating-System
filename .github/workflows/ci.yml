name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author (CONTRIBUTING.md)
        run: bash scripts/check-dco.sh "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  lint:
    name: Lint, types, layering, specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # exact tag: setup-uv publishes no floating v10 tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pyright
      - run: uv run aios specs check
      - name: The docs' reference pages match the code, and the site builds
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          uv run aios docs reference --check
          uv run mkdocs build --strict
      - name: Schemas still read what the base branch wrote (FR-EVT-10)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add ../base FETCH_HEAD
          uv run aios specs compat --against ../base/specs

  console:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  typescript-client:
    name: TypeScript client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest     # NFR-10: laptops include Windows
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # exact tag: setup-uv publishes no floating v10 tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Unit, conformance and acceptance tests
        run: uv run pytest --cov --cov-report=term --cov-fail-under=80
      - name: Red-team corpus (blocked or escalated, every case)
        run: uv run pytest tests/redteam -m redteam
      - name: AI Researcher eval gate (FR-OBS-07, M3 exit 3)
        run: >-
          uv run aios eval run apps/ai-researcher/evals/quality.yaml
          --app-dir apps/ai-researcher --cassettes tests/cassettes/ai-researcher
          --baseline apps/ai-researcher/evals/baseline.json

  postgres:
    name: PostgreSQL fabric (conformance, acceptance, NFR-01)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: aios
          POSTGRES_DB: aios
          POSTGRES_HOST_AUTH_METHOD: trust  # a throwaway database on the runner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aios -d aios"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AIOS_TEST_DATABASE_URL: postgresql://aios@127.0.0.1:5432/aios
      AIOS_BENCH_DATABASE_URL: postgresql://aios@127.0.0.1:5432/aios
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Conformance, isolation and acceptance tests on PostgreSQL (ADR-004, FR-SEC-06)
        run: uv run pytest tests/conformance tests/isolation tests/e2e -v
      - name: Fabric benchmark (NFR-01; informational on shared runners)
        continue-on-error: true
        run: >-
          uv run python benchmarks/fabric_bench.py --adapter postgres
          --events 10000 --rate 1000 --producers 8 --consumers 8

  image:
    name: Build image
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: aios:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm aios:ci --version
