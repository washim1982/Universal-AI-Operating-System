name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author (CONTRIBUTING.md)
        run: bash scripts/check-dco.sh "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  lint:
    name: Lint, types, layering, specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # exact tag: setup-uv publishes no floating v10 tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pyright
      - run: uv run aios specs check

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest     # NFR-10: laptops include Windows
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # exact tag: setup-uv publishes no floating v10 tag
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Unit, conformance and acceptance tests
        run: uv run pytest --cov --cov-report=term --cov-fail-under=80

  postgres:
    name: PostgreSQL fabric (conformance, acceptance, NFR-01)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: aios
          POSTGRES_DB: aios
          POSTGRES_HOST_AUTH_METHOD: trust  # a throwaway database on the runner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aios -d aios"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AIOS_TEST_DATABASE_URL: postgresql://aios@127.0.0.1:5432/aios
      AIOS_BENCH_DATABASE_URL: postgresql://aios@127.0.0.1:5432/aios
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Conformance suite and acceptance tests on PostgreSQL (ADR-004, M1 exit 2 and 7)
        run: uv run pytest tests/conformance tests/e2e -v
      - name: Fabric benchmark (NFR-01; informational on shared runners)
        continue-on-error: true
        run: >-
          uv run python benchmarks/fabric_bench.py --adapter postgres
          --events 10000 --rate 1000 --producers 8 --consumers 8

  image:
    name: Build image
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: aios:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm aios:ci --version
