# Requirements §7.9 format, compiled to Cedar by aios.security.cedar (ADR-007).
# ${config.*} values come from the App configuration (config.schema.json) at install time.
apiVersion: aios/v1alpha1
kind: Policy
metadata:
  name: support-desk-policy
  version: 0.3.0
spec:
  subject: { app: ai-support-desk }
  allow:
    - action: tool.invoke
      resource: "zendesk.>"
    - action: tool.invoke
      resource: "stripe.refund.create"
  deny:
    - action: tool.invoke
      resource: "stripe.customer.>"
  requireApproval:
    - action: tool.invoke
      resource: "stripe.refund.create"
      when: { input: { amountUSD: { gt: "${config.refundApprovalThresholdUSD}" } } }
      approvers: ["role:${config.approverRole}"]
    # Every App already needs a person for this (ADR-017). This says which person: the one who
    # handles refunds, so that a small poisoned one reaches somebody who will know it for what it is.
    - action: tool.invoke
      when: { sideEffect: [financial], contextTainted: true }
      approvers: ["role:${config.approverRole}"]
  # A reply is what this App is for, and it goes to the customer who asked, so it needs nobody even
  # on tainted context. That accepts a risk: a poisoned article could shape a reply. It can't move
  # money, and reply-agent has no other tool.
  taint:
    exempt: ["zendesk.ticket.comment"]
