[project]
name = "aios"
version = "0.1.0.dev0"
description = "AIOS: an operating system for AI agents (runtime, event fabric, SDK)"
readme = "README.md"
license = "Apache-2.0"  # ADR-012; the Enterprise edition is a separate, commercial package
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3,<3",          # Model Kernel adapters over official SDKs (ADR-008)
    "asyncpg>=0.32",              # PostgreSQL event fabric (ADR-004)
    "fastapi>=0.162",             # API (WP 1.7)
    "httpx2>=2.16",               # the HTTP stack of the anthropic, openai and mcp SDKs
    "jsonschema>=4.26",           # tool input/output schemas (FR-TOOL-01)
    "mcp>=2.3,<3",                # MCP client (FR-INT-01)
    "openai>=3.41,<4",
    "opentelemetry-api>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    "prometheus-client>=0.26",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
policy = [  # the Cedar policy engine (ADR-007), used by aios.security
    "cedarpy>=4.12,<5",
]
testing = [  # for third-party adapters running the conformance suites in aios.testing
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]

[project.scripts]
aios = "aios.cli.main:main"

[dependency-groups]
dev = [
    "ai-researcher",
    "aios[policy]",
    "hypothesis>=6.130",
    "import-linter>=2.3",
    "pre-commit>=4.2",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.1",
    "pytest-timeout>=2.4",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aios"]

[tool.uv]
default-groups = ["dev"]

# Reference apps with code are workspace members (ADR-001); the Support Desk joins in WP 2.7.
[tool.uv.workspace]
members = ["apps/ai-researcher"]

[tool.uv.sources]
ai-researcher = { workspace = true }

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "ASYNC",         # async pitfalls
    "PT",            # pytest style
    "RUF",           # ruff-specific
    "DTZ",           # naive datetimes
    "S",             # bandit subset
    "PL",            # pylint subset
]
ignore = [
    "PLR0913",  # too many arguments: ports have keyword-only options
    "PLR2004",  # magic values in comparisons
    "ASYNC109", # `timeout` parameters are part of the EventBus API by design
    "S105",     # "token" is topic-grammar vocabulary here, not a credential
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311", "PLR0911"]
"tests/e2e/**" = ["PLC0415"]  # imports inside tests, so a missing feature is an expected ImportError
"src/aios/testing/**" = ["S101"]  # conformance suites are pytest code shipped in the package
"benchmarks/**" = ["S311", "T201"]
"spikes/**" = ["S311", "T201"]  # throwaway experiments (spikes/README.md)

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- types

[tool.pyright]
include = ["src", "tests", "benchmarks"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

# ---------------------------------------------------------------- tests

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
xfail_strict = true
markers = [
    "acceptance: reference-app acceptance tests (expected to fail until their work package lands)",
]

[tool.coverage.run]
source = ["aios"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- layering (ADR-001)

[tool.importlinter]
root_package = "aios"

[[tool.importlinter.contracts]]
name = "Layered architecture (ADR-001)"
type = "layers"
layers = [
    "aios.cli : aios.api : aios.sdk : aios.controlplane",
    "aios.kernel | aios.workflow | aios.models | aios.tools | aios.memory | aios.security | aios.human | aios.observability",
    "aios.fabric",
    "aios.core",
]
